spring.application.name=dairyappexceldump

spring.datasource.url=jdbc:postgresql://localhost:5432/dairymart
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

dump.output.dir=

google.drive.credentials.path=classpath:service-account-key.json
google.drive.folder.id=your_google_drive_folder_id
