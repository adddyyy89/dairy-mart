        <div class="container py-5">
          <div class="row justify-content-center">
            <div class="col-lg-10">

              <h2 class="mb-4">Salesman-Retailer Mapping</h2>

              <div class="card shadow-sm mb-5">
                <div class="card-header bg-primary text-white">
                  <h5 class="card-title mb-0">Assign New Mapping</h5>
                </div>
                <div class="card-body">
                  <form id="mappingForm" class="row g-3 align-items-end">
                    <div class="col-md-5">
                      <label for="salesmanSelect" class="form-label">Select Salesman</label>
                      <select class="form-select" id="salesmanSelect" required>
                        <option value="" selected disabled>Choose a salesman...</option>
                        <option value="1">Rajesh Kumar</option>
                        <option value="2">Amit Sharma</option>
                        <option value="3">Suresh Patil</option>
                      </select>
                    </div>
                    <div class="col-md-5">
                      <label for="retailerSelect" class="form-label">Select Retailer Shop</label>
                      <select class="form-select" id="retailerSelect" required>
                        <option value="" selected disabled>Choose a retailer...</option>
                        <option value="101">City Mart - Pune</option>
                        <option value="102">General Stores - Hinjewadi</option>
                        <option value="103">Super Plaza - Kothrud</option>
                      </select>
                    </div>
                    <div class="col-md-2">
                      <button type="submit" class="btn btn-success w-100">
                        <i class="bi bi-plus-circle me-1"></i> Assign
                      </button>
                    </div>
                  </form>
                </div>
              </div>

              <div class="card shadow-sm">
                <div class="card-header bg-white">
                  <h5 class="card-title mb-0">Current Assignments</h5>
                </div>
                <div class="table-responsive">
                  <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                      <tr>
                        <th>Salesman Name</th>
                        <th>Retailer Shop</th>
                        <th>Assigned Date</th>
                        <th class="text-center">Actions</th>
                      </tr>
                    </thead>
                    <tbody id="mappingTableBody">
                      <tr>
                        <td>Rajesh Kumar</td>
                        <td>City Mart - Pune</td>
                        <td>20 Jan 2026</td>
                        <td class="text-center">
                          <button class="btn btn-sm btn-outline-primary me-1" title="Edit">
                            <i class="bi bi-pencil-square"></i>
                          </button>
                          <button class="btn btn-sm btn-outline-danger" title="Delete">
                            <i class="bi bi-trash"></i>
                          </button>
                        </td>
                      </tr>
                      <tr>
                        <td>Amit Sharma</td>
