<!doctype html>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>Dairy Mart | Settings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css" crossorigin="anonymous" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.11.0/styles/overlayscrollbars.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="../css/adminlte.css" />
  <link rel="stylesheet" href="../css/common.css" />
</head>
<body class="layout-fixed sidebar-expand-lg sidebar-open bg-body-tertiary">
  <script src="../js/auth.js"></script>
  <div class="app-wrapper">
    <div class="app-header navbar navbar-expand bg-body" id="header-container"></div>
    <div class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark" id="sidebar-container"></div>
    <main class="app-main">
      <div class="app-content-header">
        <div class="container-fluid">
          <div class="row">
            <div class="col-sm-6"><h3 class="mb-0">Settings</h3></div>
            <div class="col-sm-6">
              <ol class="breadcrumb float-sm-end">
                <li class="breadcrumb-item"><a href="../home.html">Home</a></li>
                <li class="breadcrumb-item active">Settings</li>
              </ol>
            </div>
          </div>
        </div>
      </div>
      <div class="app-content">
        <div class="container-fluid">
          <div id="alertMessage" class="mb-3" style="display:none"></div>
          <div class="card">
            <div class="card-body">
              <p class="text-secondary">These settings apply in this browser for AdminLTE. Page refresh does not run while you are typing in a field.</p>
              <div class="row g-3">
                <div class="col-md-8">
                  <label class="form-label">API server URL</label>
                  <input type="text" class="form-control" id="apiBase" placeholder="http://localhost:8080">
                </div>
                <div class="col-md-4">
                  <label class="form-label">Default inventory branch id</label>
                  <input type="number" class="form-control" id="defaultBranchId" min="1">
                </div>
                <div class="col-md-4">
                  <div class="form-check mt-4">
                    <input class="form-check-input" type="checkbox" id="pageRefreshEnabled">
                    <label class="form-check-label" for="pageRefreshEnabled">Auto-refresh the open page</label>
                  </div>
                </div>
                <div class="col-md-4">
                  <label class="form-label">Page refresh interval (seconds)</label>
                  <input type="number" class="form-control" id="pageRefreshSeconds" min="15" max="600">
                </div>
                <div class="col-md-4">
                  <label class="form-label">Live map refresh (seconds)</label>
                  <input type="number" class="form-control" id="liveMapSeconds" min="10" max="300">
                </div>
                <div class="col-md-4">
                  <label class="form-label">Header notification poll (seconds)</label>
                  <input type="number" class="form-control" id="headerNotifSeconds" min="15" max="300">
                </div>
                <div class="col-md-4">
                  <label class="form-label">Treat GPS as stale after (minutes)</label>
                  <input type="number" class="form-control" id="gpsStaleMinutes" min="1" max="180">
                </div>
                <div class="col-12">
                  <button type="button" class="btn btn-primary" onclick="saveAdminSettings()">Save settings</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <div class="app-footer" id="footer-container"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.11.0/browser/overlayscrollbars.browser.es6.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.min.js" crossorigin="anonymous"></script>
  <script src="../js/adminlte.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/settings.js"></script>
  <script src="../components/header.js"></script>
  <script src="../components/sidebar.js"></script>
  <script src="../components/footer.js"></script>
  <script src="../js/masterLayout.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () { loadLayout({basePath: '../'}); });
  </script>
</body>
</html>
