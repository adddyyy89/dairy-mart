<body class="layout-fixed sidebar-expand-lg sidebar-open bg-body-tertiary">
  <script src="../js/auth.js"></script>
  <!--begin::App Wrapper-->
  <div class="app-wrapper">
    <!--begin::Header-->
    <div class="app-header navbar navbar-expand bg-body" id="header-container"></div>
    <!--end::Header-->
    <!--begin::Sidebar-->
    <div class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark" id="sidebar-container"></div>
    <!--end::Sidebar-->
    <!--begin::App Main-->
    <main class="app-main">
      <!--begin::App Content Header-->
      <div class="app-content-header">
        <!--begin::Container-->
        <div class="container-fluid">
          <!--begin::Row-->
          <div class="row">
            <div class="col-sm-6">
              <h3 class="mb-0">Orders</h3>
            </div>
            <div class="col-sm-6">
              <ol class="breadcrumb float-sm-end">
                <li class="breadcrumb-item"><a href="#">Home</a></li>
                <li class="breadcrumb-item active" aria-current="page">Orders</li>
              </ol>
            </div>
          </div>
          <!--end::Row-->
        </div>
        <!--end::Container-->
      </div>
      <!--end::App Content Header-->
      <!--begin::App Content-->
      <div class="app-content">
        <!--begin::Container-->
        <div class="container">
          <div class="card p-4">
            <h3 class="mb-4">Order Details</h3>
            <hr>

            <div class="row">
              <div class="col-md-4">
                <div class="label-text">Order ID</div>
                <div id="orderId" class="info-value">Loading...</div>
              </div>
              <div class="col-md-4">
                <div class="label-text">Order Date</div>
                <div id="orderDate" class="info-value">-</div>
              </div>
              <div class="col-md-4">
                <div class="label-text">Status</div>
                <div id="statusDesc" class="info-value">-</div>
              </div>
            </div>

            <div class="row mt-2">
              <div class="col-md-4">
                <div class="label-text">Retailer Name</div>
                <div id="retailerName" class="info-value">-</div>
              </div>
              <div class="col-md-4">
                <div class="label-text">Branch</div>
                <div id="branchName" class="info-value">-</div>
              </div>
              <div class="col-md-4">
                <div class="label-text">Retailer Address</div>
                <div id="retailerAddress" class="info-value">-</div>
              </div>
            </div>

            <h5 class="mt-4 mb-3">Order Items</h5>
            <div class="table-responsive">
              <table class="table align-items-center table-flush">
                <thead class="table-light">
                  <tr>
                    <th>Product Code</th>
                    <th>Quantity</th>
                    <th>Unit</th>
                    <th>Sale Rate</th>
                    <th>Purchase Rate</th>
                  </tr>
                </thead>
                <tbody id="orderItemsTable">
                </tbody>
              </table>
            </div>
          </div>
        </div>
        <!--end::Container-->
      </div>
      <!--end::App Content-->
    </main>
    <!--end::App Main-->

    <!--begin::Footer-->
    <div class="app-footer" id="footer-container"></div>
    <!--end::Footer-->

  </div>

  <script src="../js/adminlte.js"></script>
  <script src="../js/orderdetails.js"></script>
  <!--end::Required Plugin(AdminLTE)-->

  <script src="../components/header.js"></script>
  <script src="../components/sidebar.js"></script>
  <script src="../components/footer.js"></script>

    document.addEventListener('DOMContentLoaded', function () {
      loadLayout({ basePath: '../' });
    });
  </script>
