<!doctype html>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>Dairy Mart | Salesmen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css"
    integrity="sha256-tXJfXfp6Ewt1ilPzLDtQnJV4hclT9XuaZUKyUvmyr+Q=" crossorigin="anonymous" media="print"
    onload="this.media='all'" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.11.0/styles/overlayscrollbars.min.css"
    crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    crossorigin="anonymous" />
  <link rel="stylesheet" href="../css/adminlte.css" />
  <link rel="stylesheet" href="../css/common.css" />
  <style>
    .filter-container { background: #f8f9fa; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    .table-container { box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden; }
  </style>
</head>
<body class="layout-fixed sidebar-expand-lg sidebar-open bg-body-tertiary" data-user-type="2">
  <script src="../js/auth.js"></script>
  <div class="app-wrapper">
    <div class="app-header navbar navbar-expand bg-body" id="header-container"></div>
    <div class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark" id="sidebar-container"></div>
    <main class="app-main">
      <div class="app-content-header">
        <div class="container-fluid">
          <div class="row">
            <div class="col-sm-6">
              <h3 class="mb-0">Salesmen</h3>
            </div>
            <div class="col-sm-6">
              <ol class="breadcrumb float-sm-end">
                <li class="breadcrumb-item"><a href="../home.html">Home</a></li>
                <li class="breadcrumb-item active" aria-current="page">Salesmen</li>
              </ol>
            </div>
          </div>
        </div>
      </div>
      <div class="app-content">
        <div class="container-fluid">
          <div class="filter-container">
            <div class="row g-3 align-items-center">
              <div class="col">
                <input type="text" id="searchInput" class="form-control" placeholder="Search by name, phone or email..." onkeyup="searchTable()">
              </div>
              <div class="col-auto">
                <a href="./adduser.html?type=2" class="btn btn-success">
                  <i class="bi bi-plus-lg me-1"></i>Add Salesman
                </a>
              </div>
              <div class="col-auto">
                <a href="./salesman-retailer-map.html" class="btn btn-outline-primary">
                  <i class="bi bi-diagram-3 me-1"></i>Assign Retailers
                </a>
              </div>
            </div>
          </div>
          <div class="table-container bg-white">
            <table class="table table-hover mb-0" id="userTable">
              <thead class="table-dark">
                <tr>
                  <th>First Name</th>
                  <th>User Type</th>
                  <th>Mobile Number</th>
                  <th>Email Id</th>
                  <th>Full Address</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="users-table"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
    <div class="app-footer" id="footer-container"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.11.0/browser/overlayscrollbars.browser.es6.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.min.js" crossorigin="anonymous"></script>
  <script src="../js/adminlte.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/roleusers.js"></script>
  <script src="../components/header.js"></script>
  <script src="../components/sidebar.js"></script>
  <script src="../components/footer.js"></script>
  <script src="../js/masterLayout.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      loadLayout({basePath: '../'});
    });
  </script>
</body>
</html>
