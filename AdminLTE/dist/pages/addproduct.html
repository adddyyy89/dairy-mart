<!doctype html>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>Dairy Mart | Add Product</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css"
    integrity="sha256-tXJfXfp6Ewt1ilPzLDtQnJV4hclT9XuaZUKyUvmyr+Q=" crossorigin="anonymous" media="print"
    onload="this.media='all'" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.11.0/styles/overlayscrollbars.min.css"
    crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    crossorigin="anonymous" />
  <link rel="stylesheet" href="../css/adminlte.css" />
  <style>
    .form-container { background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.08); }
  </style>
</head>
<body class="layout-fixed sidebar-expand-lg sidebar-open bg-body-tertiary">
  <script src="../js/auth.js"></script>
  <div class="app-wrapper">
    <div class="app-header navbar navbar-expand bg-body" id="header-container"></div>
    <div class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark" id="sidebar-container"></div>
    <main class="app-main">
      <div class="app-content-header">
        <div class="container-fluid">
          <div class="row">
            <div class="col-sm-6">
              <h3 class="mb-0">Add Product</h3>
            </div>
            <div class="col-sm-6">
              <ol class="breadcrumb float-sm-end">
                <li class="breadcrumb-item"><a href="../home.html">Home</a></li>
                <li class="breadcrumb-item"><a href="./products.html">Products</a></li>
                <li class="breadcrumb-item active" aria-current="page">Add Product</li>
              </ol>
            </div>
          </div>
        </div>
      </div>
      <div class="app-content">
        <div class="container-fluid">
          <div class="row">
            <div class="col-lg-8 col-md-10 mx-auto">
              <div class="form-container">
                <form id="addProductForm">
                  <div class="row mb-3">
                    <div class="col-md-6">
                      <label for="productName" class="form-label">Product Name <span class="text-danger">*</span></label>
                      <input type="text" class="form-control" id="productName" required>
                    </div>
                    <div class="col-md-6">
                      <label for="productShortName" class="form-label">Short Name</label>
                      <input type="text" class="form-control" id="productShortName">
                    </div>
                  </div>
                  <div class="row mb-3">
                    <div class="col-md-6">
                      <label for="productCode" class="form-label">Product Code</label>
                      <input type="text" class="form-control" id="productCode">
                    </div>
                    <div class="col-md-6">
                      <label for="hsn" class="form-label">HSN</label>
                      <input type="text" class="form-control" id="hsn">
                    </div>
                  </div>
                  <div class="row mb-3">
                    <div class="col-md-6">
                      <label for="productTypeId" class="form-label">Product Type <span class="text-danger">*</span></label>
                      <select class="form-select" id="productTypeId" required>
                        <option value="" selected disabled>Select Product Type</option>
                      </select>
                    </div>
                    <div class="col-md-6">
                      <label for="brandId" class="form-label">Brand Id</label>
                      <input type="number" class="form-control" id="brandId" value="1" min="1">
                    </div>
                  </div>
                  <div class="row mb-3">
                    <div class="col-md-4">
                      <label for="productPurchaseRate" class="form-label">Purchase Rate</label>
                      <input type="text" class="form-control" id="productPurchaseRate">
                    </div>
                    <div class="col-md-4">
                      <label for="productSaleRate" class="form-label">Sale Rate <span class="text-danger">*</span></label>
                      <input type="text" class="form-control" id="productSaleRate" required>
                    </div>
                    <div class="col-md-4">
                      <label for="mrp" class="form-label">MRP <span class="text-danger">*</span></label>
                      <input type="text" class="form-control" id="mrp" required>
                    </div>
                  </div>
                  <div class="row mb-3">
                    <div class="col-md-4">
                      <label for="quantity" class="form-label">Quantity</label>
                      <input type="text" class="form-control" id="quantity">
                    </div>
                    <div class="col-md-4">
                      <label for="unit" class="form-label">Unit</label>
                      <input type="text" class="form-control" id="unit" placeholder="ltr, kg, pcs">
                    </div>
                    <div class="col-md-4">
                      <label for="igst" class="form-label">IGST %</label>
                      <input type="text" class="form-control" id="igst" value="0">
                    </div>
                  </div>
                  <div class="mb-3">
                    <label for="productPictureUrl" class="form-label">Picture URL</label>
                    <input type="url" class="form-control" id="productPictureUrl" placeholder="https://">
                  </div>
                  <div class="row mb-3">
                    <div class="col-md-6">
                      <label class="form-label">Status</label>
                      <div class="form-check form-switch mt-2">
                        <input class="form-check-input" type="checkbox" id="isActive" checked>
                        <label class="form-check-label" for="isActive">Active</label>
                      </div>
                    </div>
                  </div>
                  <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary">
                      <i class="bi bi-plus-lg me-1"></i>Add Product
                    </button>
                    <a href="./products.html" class="btn btn-secondary">
                      <i class="bi bi-x-lg me-1"></i>Cancel
                    </a>
                  </div>
                </form>
                <div id="alertMessage" class="mt-3" style="display: none;"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <div class="app-footer" id="footer-container"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.11.0/browser/overlayscrollbars.browser.es6.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.min.js" crossorigin="anonymous"></script>
  <script src="../js/adminlte.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/addproduct.js"></script>
  <script src="../components/header.js"></script>
  <script src="../components/sidebar.js"></script>
  <script src="../components/footer.js"></script>
  <script src="../js/masterLayout.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      loadLayout({basePath: '../'});
    });
  </script>
</body>
</html>
