<body class="layout-fixed sidebar-expand-lg sidebar-open bg-body-tertiary">
  <script src="../js/auth.js"></script>
  <!--begin::App Wrapper-->
  <div class="app-wrapper">
    <!--begin::Header-->
    <div class="app-header navbar navbar-expand bg-body" id="header-container"></div>
    <!--end::Header-->
    <!--begin::Sidebar-->
    <div class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark" id="sidebar-container"></div>
    <!--end::Sidebar-->
    <!--begin::App Main-->
    <main class="app-main">
      <div class="app-content-header">
        <div class="container-fluid">
          <div class="row">
            <div class="col-sm-6">
              <h3 class="mb-0">Add New User</h3>
            </div>
            <div class="col-sm-6">
              <ol class="breadcrumb float-sm-end">
                <li class="breadcrumb-item"><a href="#">Home</a></li>
                <li class="breadcrumb-item"><a href="./users.html">Users</a></li>
                <li class="breadcrumb-item active" aria-current="page">Add User</li>
              </ol>
            </div>
          </div>
        </div>
      </div>
      
      <div class="app-content">
        <div class="container-fluid">
          <div class="row">
            <div class="col-lg-8 col-md-10 mx-auto">
              <div class="form-container">
                <form id="addUserForm">
                  <div class="row mb-3">
                    <div class="col-md-6">
                      <label for="firstName" class="form-label">First Name <span class="text-danger">*</span></label>
                      <input type="text" class="form-control" id="firstName" name="firstName" required>
                    </div>
                    <div class="col-md-6">
                      <label for="lastName" class="form-label">Last Name</label>
                      <input type="text" class="form-control" id="lastName" name="lastName">
                    </div>
                  </div>
                  
                  <div class="row mb-3">
                    <div class="col-md-6">
                      <label for="phoneNumber" class="form-label">Phone Number <span class="text-danger">*</span></label>
                      <input type="tel" class="form-control" id="phoneNumber" name="phoneNumber" required pattern="[0-9]{10}" placeholder="10 digit number">
                    </div>
                    <div class="col-md-6">
                      <label for="emailId" class="form-label">Email <span class="text-danger">*</span></label>
                      <input type="email" class="form-control" id="emailId" name="emailId" required>
                    </div>
                  </div>
                  
                  <div class="row mb-3">
                    <div class="col-md-6">
                      <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
                      <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="col-md-6">
                      <label for="userTypeId" class="form-label">User Type <span class="text-danger">*</span></label>
                      <select class="form-select" id="userTypeId" name="userTypeId" required>
                        <option value="" selected disabled>Select User Type</option>
                        <option value="1">Admin</option>
                        <option value="2">Salesman</option>
                        <option value="3">Retailer</option>
                      </select>
                    </div>
                  </div>
                  
                  <div class="mb-3">
                    <label for="fullAddress" class="form-label">Full Address <span class="text-danger">*</span></label>
                    <textarea class="form-control" id="fullAddress" name="fullAddress" rows="3" required></textarea>
                  </div>
                  
                  <div class="row mb-3">
                    <div class="col-md-6">
                      <label for="stateDropdown" class="form-label">State</label>
                      <select id="stateDropdown" class="form-control" name="stateId" onchange="fetchCities()">
                        <option value="">-- Loading States... --</option>
                      </select>
                    </div>
                    <div class="col-md-6">
                      <label for="cityDropdown" class="form-label">City</label>
                      <select id="cityDropdown" class="form-control" name="cityId">
                        <option value="">-- Loading Cities... --</option>
                      </select>
                    </div>
                  </div>


                  <div class="row mb-3">
                    <div class="col-md-6">
                      <label class="form-label">Status</label>
                      <div class="form-check form-switch mt-2">
                        <input class="form-check-input" type="checkbox" id="isActive" name="isActive" checked>
                        <label class="form-check-label" for="isActive">Active</label>
                      </div>
                    </div>
                  </div>
                  
                  <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary">
                      <i class="bi bi-plus-lg me-1"></i>Add User
                    </button>
                    <a href="./users.html" class="btn btn-secondary">
                      <i class="bi bi-x-lg me-1"></i>Cancel
                    </a>
                  </div>
                </form>
                
                <!-- Alert for success/error messages -->
                <div id="alertMessage" class="mt-3" style="display: none;"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <!--end::App Main-->
    <!--begin::Footer-->
    <div class="app-footer" id="footer-container"></div>
