<!doctype html>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>Dairy Mart | Ledger</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css" crossorigin="anonymous" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.11.0/styles/overlayscrollbars.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="../css/adminlte.css" />
  <style>
    .form-container { background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.08); }
  </style>
</head>
<body class="layout-fixed sidebar-expand-lg sidebar-open bg-body-tertiary">
  <script src="../js/auth.js"></script>
  <div class="app-wrapper">
    <div class="app-header navbar navbar-expand bg-body" id="header-container"></div>
    <div class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark" id="sidebar-container"></div>
    <main class="app-main">
      <div class="app-content-header">
        <div class="container-fluid">
          <div class="row">
            <div class="col-sm-6">
              <h3 class="mb-0" id="retailerName">Ledger</h3>
              <div class="text-muted" id="retailerAddress"></div>
            </div>
            <div class="col-sm-6">
              <ol class="breadcrumb float-sm-end">
                <li class="breadcrumb-item"><a href="../home.html">Home</a></li>
                <li class="breadcrumb-item"><a href="./ledgers.html">Ledgers</a></li>
                <li class="breadcrumb-item active">Detail</li>
              </ol>
            </div>
          </div>
        </div>
      </div>
      <div class="app-content">
        <div class="container-fluid">
          <div id="alertMessage" class="mb-3" style="display:none"></div>
          <div class="row g-3 mb-3">
            <div class="col-md-4">
              <div class="form-container h-100">
                <div class="text-muted">Ledger balance</div>
                <div id="ledgerBalance" class="fs-2 fw-bold">₹0.00</div>
                <div class="small text-muted mt-2">Negative means the retailer still owes money.</div>
              </div>
            </div>
            <div class="col-md-8">
              <div class="form-container">
                <h5 class="mb-3">Record collection</h5>
                <form id="collectionForm" class="row g-2 align-items-end">
                  <div class="col-md-5">
                    <label class="form-label" for="amount">Amount</label>
                    <input type="number" step="0.01" min="0.01" class="form-control" id="amount" required>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label" for="paymentTypeId">Mode</label>
                    <select id="paymentTypeId" class="form-select">
                      <option value="1">Cash</option>
                      <option value="2">UPI</option>
                    </select>
                  </div>
                  <div class="col-md-3">
                    <button type="submit" class="btn btn-primary w-100">Save</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
          <div class="table-responsive bg-white rounded shadow-sm">
            <table class="table table-hover mb-0">
              <thead class="table-dark">
                <tr>
                  <th>When</th>
                  <th>Type</th>
                  <th>Side</th>
                  <th>Amount</th>
                </tr>
              </thead>
              <tbody id="tx-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
    <div class="app-footer" id="footer-container"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.11.0/browser/overlayscrollbars.browser.es6.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.min.js" crossorigin="anonymous"></script>
  <script src="../js/adminlte.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ledgerdetails.js"></script>
  <script src="../components/header.js"></script>
  <script src="../components/sidebar.js"></script>
  <script src="../components/footer.js"></script>
  <script src="../js/masterLayout.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () { loadLayout({basePath: '../'}); });
  </script>
</body>
</html>
